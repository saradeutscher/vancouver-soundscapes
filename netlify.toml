[build]
  # Build command
  command = "npm run build"

  # Output directory
  publish = "dist"

  # Environment variables
  [build.environment]
    NODE_VERSION = "18"

# Redirect rules
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Optoins = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets for 1 year
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31535000, immutable"

# Cache sounds.json for shorter time
[[headers]]
  for = "/src/data/sounds.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Optimization settings
[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = true
  minify = true

[build.processing.html]
  pretty_urls = true

[build.processing.images]
  compress = true